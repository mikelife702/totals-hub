name: History pull (past seasons)

on:
  workflow_dispatch:        # run by hand from the Actions tab
    inputs:
      seasons:
        description: 'Seasons to pull (e.g. ncaa2024 nba2024, or ncaa2025 nba2025)'
        default: 'ncaa2024 nba2024'

permissions:
  contents: write

concurrency:
  group: ratings
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pull past-season college + NBA games (box scores, halves, closing lines)
        run: node scripts/build-ratings.mjs ${{ inputs.seasons }}
      - name: Commit history data
        run: |
          git config user.name "ratings-bot"
          git config user.email "ratings-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "History pull ${{ inputs.seasons }} $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
