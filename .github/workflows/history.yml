name: History pull (last season)

on:
  workflow_dispatch: {}     # run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: ratings
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pull 2025-26 college + NBA games (box scores, halves, closing lines)
        run: node scripts/build-ratings.mjs ncaa2025 nba2025
      - name: Commit history data
        run: |
          git config user.name "ratings-bot"
          git config user.email "ratings-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "History pull 2025-26 $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
