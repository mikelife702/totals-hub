name: NBA shot tracking pull (defender distance)
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Seasons (space separated)'
        default: 'nba2025 nba2024'
      test:
        description: 'Test one date only (1) or full pull (blank)'
        default: '1'
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull
        env:
          TEST: ${{ inputs.test }}
        run: for s in ${{ inputs.seasons }}; do node scripts/pull-nba-tracking.mjs $s; done
      - name: Commit
        if: always()
        run: |
          git config user.name "totals-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*-nbadef.json || true
          git commit -m "NBA shot tracking by defender distance" || echo "nothing to commit"
          git pull --rebase
          git push
