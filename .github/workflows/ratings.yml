name: Nightly team ratings

on:
  schedule:
    - cron: '17 9 * * *'   # every day around 4-5am New York time, after the night's games
  workflow_dispatch: {}     # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: ratings
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build ratings (college + NBA)
        run: node scripts/build-ratings.mjs ncaa nba
      - name: Build picks (college, morning openers)
        run: node scripts/build-picks.mjs || echo "picks step failed (ratings still committed)"
      - name: Commit updated data
        run: |
          git config user.name "ratings-bot"
          git config user.email "ratings-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Nightly ratings $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
