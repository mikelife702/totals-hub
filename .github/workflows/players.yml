name: Player minutes pull (prospect teams, last season)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/pull-players.mjs
      - name: Commit
        run: |
          git config user.name "totals-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ncaa2025-players.json
          git commit -m "Player minutes for prospect teams (2025-26)" || echo "nothing to commit"
          git pull --rebase
          git push
