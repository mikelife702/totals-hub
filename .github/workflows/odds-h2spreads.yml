name: Odds API 2nd-half spreads (past season)

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'Season file (ncaa2025, ncaa2024)'
        default: 'ncaa2025'
      minleft:
        description: 'Stop when credits left fall below this'
        default: '100'

permissions:
  contents: write

concurrency:
  group: ratings
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pull 2nd-half spreads
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MIN_LEFT: ${{ inputs.minleft }}
        run: node scripts/odds-h2spreads.mjs "${{ inputs.season }}"
      - name: Commit
        if: always()
        run: |
          git config user.name "ratings-bot"
          git config user.email "ratings-bot@users.noreply.github.com"
          git add data/*-h2spreads.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "2nd-half spreads ${{ inputs.season }} $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
