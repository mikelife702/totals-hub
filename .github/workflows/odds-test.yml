name: Odds API test (few credits)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ratings
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test the Odds API key and historical markets
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/odds-test.mjs
      - name: Commit test report (no key inside)
        run: |
          git config user.name "ratings-bot"
          git config user.email "ratings-bot@users.noreply.github.com"
          git add data/odds-test.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Odds API test report"
            git pull --rebase
            git push
          fi
