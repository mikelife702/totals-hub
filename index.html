<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Totals Hub</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:#111;font-size:15px}
header{background:#1f3a5f;color:#fff;padding:12px 14px}
header h1{margin:0;font-size:18px;font-weight:600}
header .sub{font-size:12px;opacity:.85;margin-top:2px}
main{padding:12px 10px;max-width:1280px;margin:0 auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
button{font:inherit;padding:8px 12px;border:1px solid #1f3a5f;background:#fff;color:#1f3a5f;border-radius:6px;cursor:pointer}
button.on{background:#1f3a5f;color:#fff}
input{font:inherit;font-size:16px;padding:7px 8px;border:1px solid #bbb;border-radius:6px;width:100%}
input[type=date]{width:auto}
label{font-size:11px;color:#555;display:block;margin-bottom:3px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:14px;max-height:260px;overflow-y:auto}
.g{border:1px solid #ddd;border-radius:8px;padding:7px 9px;cursor:pointer;font-size:14px}
.g.sel{border:2px solid #1f3a5f}
.g .st{font-size:12px;color:#666}
.g .t{display:flex;justify-content:space-between}
.live{color:#b42318;font-weight:600}
.lines{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.card{background:#f4f6f9;border-radius:8px;padding:9px 11px}
.card .l{font-size:12px;color:#555}
.card .v{font-size:21px;font-weight:600}
.card .s{font-size:12px;color:#555}
.verdict{border:1px solid #ddd;border-radius:8px;padding:10px 12px;margin:8px 0;font-size:15px}
.verdict.over{border-color:#2e7d32;background:#f1f8f1}
.verdict.under{border-color:#b42318;background:#fdf3f2}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0 12px}
th{background:#1f3a5f;color:#fff;font-weight:600;padding:6px 4px;text-align:right;font-size:12px}
th:first-child,td:first-child{text-align:left}
th.grp{text-align:center;border-left:2px solid #fff}
td{padding:5px 4px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap}
td.sep,th.sep{border-left:2px solid #dfe4ea}
td small{color:#888;font-size:11px;display:block}
.up{color:#2e7d32;font-weight:600}
.dn{color:#b42318;font-weight:600}
.note{font-size:12px;color:#666;margin:4px 0}
.err{color:#b42318;font-size:13px;margin:8px 0}
h2{font-size:16px;margin:14px 0 6px}
h3{font-size:14px;margin:14px 0 4px}
.tblwrap{overflow-x:auto}
.chart{width:100%;height:auto;display:block;margin:4px 0 2px}
.legend{font-size:12px;color:#555;display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.legend span:before{content:"";display:inline-block;width:14px;height:3px;margin-right:5px;vertical-align:middle;background:var(--c)}
.layer{border-top:3px solid #1f3a5f;margin-top:16px;padding-top:4px}
.dkbar{background:#f4f6f9;border-radius:8px;padding:7px 10px;font-size:13px;margin:-4px 0 10px}
.dkbar b{font-size:15px}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:18px;align-items:start}
.side{position:sticky;top:8px;border:1px solid #dfe4ea;border-radius:10px;padding:10px 12px;background:#fff}
.side h3{margin:2px 0 8px}
.bk{display:grid;grid-template-columns:minmax(0,1fr) 120px 52px;gap:6px;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px solid #f0f2f5}
.bk .lab small{display:block;color:#888;font-size:11px}
.bk .val{text-align:right;font-weight:600;white-space:nowrap}
.bar{position:relative;height:12px;background:#f4f6f9;border-radius:3px}
.bar:after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;border-left:1px solid #b8c0ca}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px}
.bk.tot{border-top:2px solid #1f3a5f;border-bottom:none;font-size:14px}
.bk.sub{font-size:12px;color:#555}
.sec{font-size:11px;color:#1f3a5f;font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin:10px 0 2px}
@media(max-width:980px){.wrap{grid-template-columns:minmax(0,1fr)}.side{position:static;order:-1}}
.vbox{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:0 0 10px}
.vbox div{background:#eef2f7;border-radius:8px;padding:6px 9px}
.vbox .l{font-size:11px;color:#555}
.vbox .v{font-size:17px;font-weight:600}
.vbox .s{font-size:11px;color:#555}
.warn{background:#fff4e5;border:1px solid #f0b46a;border-radius:8px;padding:7px 10px;font-size:13px;margin:0 0 10px}
@media(max-width:520px){.vbox{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pacebox{border-left:3px solid #1f3a5f;padding:6px 10px;margin:6px 0;font-size:14px;background:#f8fafc}
@media(max-width:520px){.lines{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
<h1>Live totals hub</h1>
<div class="sub">Over/under model · v7 · data from ESPN · lines from DraftKings</div>
</header>
<main>
<div class="row">
<button id="bNcaa" class="on" onclick="setLeague('ncaa')">College (men)</button>
<button id="bNba" onclick="setLeague('nba')">NBA</button>
<input type="date" id="date">
<button onclick="loadGames()">Load games</button>
</div>
<div id="gmsg" class="note"></div>
<div class="games" id="games"></div>
<div id="game"></div>
</main>
<script>
const CFG={
 nba:{path:'basketball/nba',periods:4,plen:12,total:48,ot:5,ftc:0.44,sd:17,h1share:0.5,name:'NBA',endMin:4,bands:[[3,'close',0.8],[10,'fouling range',1.3],[999,'blowout',0.4]]},
 ncaa:{path:'basketball/mens-college-basketball',periods:2,plen:20,total:40,ot:5,ftc:0.475,sd:15,h1share:0.47,name:'College',endMin:4,bands:[[5,'close',0.7],[12,'fouling range',1.3],[999,'blowout',0.4]]}
};
const BASE='https://site.api.espn.com/apis/site/v2/sports/';
const NGAMES=10, VER='r2';
let league='ncaa', cur=null, timer=null;
const memo={};

function cacheGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function cacheSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
async function getJSON(url){const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function ymd(d){return d.toISOString().slice(0,10).replace(/-/g,'')}
function setLeague(l){
 league=l;
 document.getElementById('bNcaa').classList.toggle('on',l==='ncaa');
 document.getElementById('bNba').classList.toggle('on',l==='nba');
 loadGames();
}

function teamStat(stats,names){for(const n of names){const s=stats.find(x=>x.name===n);if(s&&s.displayValue!==undefined&&s.displayValue!=='')return s.displayValue}return null}
function pair(v){if(!v)return[0,0];const p=String(v).split('-');return[+p[0]||0,+p[1]||0]}
function num(v){return v==null?0:(parseFloat(v)||0)}
function clockSec(v){const s=String(v==null?'0':v);if(s.includes(':')){const p=s.split(':');return(+p[0]||0)*60+(parseFloat(p[1])||0)}return parseFloat(s)||0}

function parseTeamBox(t){
 const s=t.statistics||[];
 const fg=pair(teamStat(s,['fieldGoalsMade-fieldGoalsAttempted']));
 const tp=pair(teamStat(s,['threePointFieldGoalsMade-threePointFieldGoalsAttempted']));
 const ft=pair(teamStat(s,['freeThrowsMade-freeThrowsAttempted']));
 return{id:String(t.team.id),name:t.team.shortDisplayName||t.team.displayName||t.team.abbreviation,
  fgm:fg[0],fga:fg[1],tpm:tp[0],tpa:tp[1],ftm:ft[0],fta:ft[1],
  orb:num(teamStat(s,['offensiveRebounds'])),drb:num(teamStat(s,['defensiveRebounds'])),
  tov:num(teamStat(s,['totalTurnovers','turnovers'])),pf:num(teamStat(s,['fouls','totalFouls'])),pts:0,ptime:0};
}

function periodStart(c,n){return n<=c.periods?(n-1)*c.plen*60:c.total*60+(n-c.periods-1)*c.ot*60}
function periodLen(c,n){return(n<=c.periods?c.plen:c.ot)*60}

function elapsedMin(c,status){
 const st=status.type||{};
 if(st.state==='pre')return 0;
 const p=status.period||1;
 if(st.state==='post'||st.completed)return p<=c.periods?c.total:c.total+(p-c.periods)*c.ot;
 const clk=(status.clock!=null?status.clock:clockSec(status.displayClock))/60;
 return(periodStart(c,p)+periodLen(c,p))/60-clk;
}

const OFF_RE=/turnover|offensive charge|offensive foul|travel|shot clock/i;
function possessionTime(plays,c,teams){
 let seg=0,per=1;
 (plays||[]).forEach(p=>{
  const n=(p.period&&p.period.number)||per;
  if(n!==per){per=n;seg=periodStart(c,n)}
  const t=periodStart(c,n)+periodLen(c,n)-clockSec(p.clock&&p.clock.displayValue);
  const tid=p.team&&p.team.id?String(p.team.id):null;
  const txt=((p.type&&p.type.text)||'')+' '+(p.text||'');
  const off=tid&&teams[tid]&&(p.shootingPlay||(OFF_RE.test(txt)&&!/kicked ball/i.test(txt)));
  if(off){teams[tid].ptime+=Math.max(0,t-seg);seg=t}
 });
}

function poss(t,c){return t.fga+c.ftc*t.fta-t.orb+t.tov}

function playDetail(plays,c,teams,comp){
 const ids=Object.keys(teams),home=comp.competitors.find(x=>x.homeAway==='home'),homeId=String(home?(home.id||home.team.id):ids[0]);
 const blank=()=>({pts:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,orb:0,tov:0});
 const periods={};
 const timeline=[{t:0,pts:0,poss:0}];
 let cum={},lastH=0,lastA=0,lastT=-1;ids.forEach(i=>cum[i]=blank());
 plays.forEach(p=>{
  const n=(p.period&&p.period.number)||1;
  if(!periods[n]){periods[n]={};ids.forEach(i=>periods[n][i]=blank())}
  const t=periodStart(c,n)+periodLen(c,n)-clockSec(p.clock&&p.clock.displayValue);
  const tid=p.team&&p.team.id?String(p.team.id):null;
  const txt=((p.type&&p.type.text)||'')+' '+(p.text||'');
  const hs=num(p.homeScore),as=num(p.awayScore);
  if(hs!==lastH||as!==lastA){
   const dh=hs-lastH,da=as-lastA;
   ids.forEach(i=>{const d=i===homeId?dh:da;if(d>0)periods[n][i].pts+=d});
   lastH=hs;lastA=as;
  }
  if(tid&&periods[n][tid]){
   const P=periods[n][tid],C=cum[tid];
   const add=(k)=>{P[k]++;C[k]++};
   if(p.shootingPlay){
    if(/free throw|freethrow/i.test(txt)){add('fta');if(p.scoringPlay)add('ftm')}
    else{add('fga');if(p.scoringPlay)add('fgm');if(p.pointsAttempted===3||/three point|3-pt|three-point/i.test(txt)){add('tpa');if(p.scoringPlay)add('tpm')}}
   }else if(/offensive rebound/i.test(txt))add('orb');
   else if(OFF_RE.test(txt)&&!/kicked ball/i.test(txt))add('tov');
  }
  const gp=ids.reduce((s,i)=>s+poss(cum[i],c),0)/2;
  if(t-lastT>=20||p===plays[plays.length-1]){timeline.push({t:t/60,pts:hs+as,poss:gp});lastT=t}
 });
 return{periods,timeline};
}

function buildRecord(sum,c,withDetail){
 const comp=sum.header.competitions[0];
 const status=comp.status||{};
 const teams={};
 ((sum.boxscore&&sum.boxscore.teams)||[]).forEach(t=>{const b=parseTeamBox(t);teams[b.id]=b});
 const order=[];
 comp.competitors.forEach(cp=>{
  const id=String(cp.id||cp.team.id);
  if(!teams[id])teams[id]={id,name:cp.team.shortDisplayName||cp.team.displayName,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,orb:0,drb:0,tov:0,pf:0,pts:0,ptime:0};
  teams[id].pts=num(cp.score);teams[id].homeAway=cp.homeAway;order.push(id);
 });
 const hasPlays=!!(sum.plays&&sum.plays.length);
 if(hasPlays)possessionTime(sum.plays,c,teams);
 let periods=null,timeline=null;
 if(withDetail&&hasPlays){const d=playDetail(sum.plays,c,teams,comp);periods=d.periods;timeline=d.timeline}
 let ou=null;(sum.pickcenter||[]).forEach(p=>{if(ou==null&&p.overUnder)ou=+p.overUnder});
 let dk=null;const pc=(sum.pickcenter||[]).find(p=>p.total)||null;
 if(pc){
  const tl=pc.total,ln=v=>{const n=parseFloat(String(v||'').replace(/^[ou]/i,''));return isNaN(n)?null:n};
  const od=v=>{if(v==null)return null;if(/even/i.test(String(v)))return 100;const n=parseFloat(v);return isNaN(n)?null:n};
  const g=(side,k)=>(tl[side]&&tl[side][k])||{};
  dk={prov:(pc.provider&&pc.provider.name)||'DraftKings',open:ln(g('over','open').line),close:ln(g('over','close').line),live:ln(g('over','live').line),
   overOdds:od(g('over','live').odds)||od(g('over','close').odds)||od(pc.overOdds),underOdds:od(g('under','live').odds)||od(g('under','close').odds)||od(pc.underOdds)};
  if(!dk.close&&pc.overUnder)dk.close=+pc.overUnder;
 }
 const st=status.type||{};
 return{teams,order,state:st.state,completed:!!st.completed,detail:st.shortDetail||'',elapsed:elapsedMin(c,status),date:comp.date,ou,dk,hasPlays,periods,timeline};
}

async function record(lg,id,final){
 const k=VER+'_'+lg+'_'+id;
 if(final){const hit=memo[k]||cacheGet(k);if(hit)return hit}
 const js=await getJSON(BASE+CFG[lg].path+'/summary?event='+id);
 const rec=buildRecord(js,CFG[lg],!final);
 if(rec.completed){memo[k]=rec;cacheSet(k,rec)}
 return rec;
}

async function pool(items,n,fn){
 const out=[];let i=0;
 async function w(){while(i<items.length){const k=i++;try{out[k]=await fn(items[k])}catch(e){out[k]=null}}}
 await Promise.all(Array.from({length:n},w));return out;
}

async function teamHistory(lg,teamId,excludeId){
 const c=CFG[lg];
 const js=await getJSON(BASE+c.path+'/teams/'+teamId+'/schedule');
 const evs=(js.events||[]).filter(e=>{
  const st=(e.competitions&&e.competitions[0].status&&e.competitions[0].status.type)||{};
  return st.completed&&String(e.id)!==String(excludeId);
 }).sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(-NGAMES);
 const recs=await pool(evs.map(e=>e.id),4,id=>record(lg,id,true));
 const games=[];
 recs.forEach(r=>{
  if(!r)return;
  const me=r.teams[String(teamId)],oid=r.order.find(x=>x!==String(teamId)),op=r.teams[oid];
  if(!me||!op||!me.fga||!op.fga)return;
  games.push({me,op,mins:r.elapsed||c.total,hasPlays:r.hasPlays});
 });
 return games;
}

function agg(games,c){
 if(!games||!games.length)return null;
 const K=['pts','fgm','fga','tpm','tpa','ftm','fta','orb','drb','tov'];
 const S={},O={};K.forEach(k=>{S[k]=0;O[k]=0});
 let mins=0,gposs=0,myPoss=0,ptime=0,ptPoss=0;
 games.forEach(g=>{
  K.forEach(k=>{S[k]+=g.me[k];O[k]+=g.op[k]});
  mins+=g.mins;
  const pm=poss(g.me,c),po=poss(g.op,c);
  gposs+=(pm+po)/2;myPoss+=pm;
  if(g.hasPlays&&g.me.ptime>0){ptime+=g.me.ptime;ptPoss+=pm}
 });
 return stats(S,O,games.length,mins,gposs,myPoss,ptime,ptPoss,c);
}

function stats(S,O,n,mins,gposs,myPoss,ptime,ptPoss,c){
 const d=(a,b)=>b?a/b:null,scale=n;
 return{n,mins,myPoss,
  pts:S.pts/scale,fga:S.fga/scale,tpa:S.tpa/scale,fta:S.fta/scale,orb:S.orb/scale,tov:S.tov/scale,
  fg:d(S.fgm,S.fga),tp:d(S.tpm,S.tpa),ft:d(S.ftm,S.fta),
  poss:gposs/scale,pace:d(gposs,mins)*c.total,ppp:d(S.pts,myPoss),
  orbp:d(S.orb,S.orb+O.drb),tovp:d(S.tov,myPoss),
  spp:ptPoss>0?ptime/ptPoss:null,
  opts:O.pts/scale,oppp:d(O.pts,myPoss),
  raw:{fgm:S.fgm,fga:S.fga,tpm:S.tpm,tpa:S.tpa,ftm:S.ftm,fta:S.fta,orb:S.orb,tov:S.tov,pts:S.pts}
 };
}

function liveStats(me,op,c,el,hasPlays){
 const K=['pts','fgm','fga','tpm','tpa','ftm','fta','orb','drb','tov'];
 const S={},O={};K.forEach(k=>{S[k]=me[k];O[k]=op[k]});
 const pm=poss(me,c),po=poss(op,c);
 const f=el/c.total;
 const st=stats(S,O,f>0?f:1,el,(pm+po)/2,pm,hasPlays?me.ptime:0,hasPlays&&me.ptime>0?pm:0,c);
 st.pm=pm;
 return st;
}

function phi(z){const t=1/(1+0.2316419*Math.abs(z));const d=0.3989423*Math.exp(-z*z/2);const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
function remImplied(L,L1,el,c){const k=clockParts(L,L1,el,c);return k.reg+k.prem}
function clockParts(L,L1,el,c){
 const h=c.total/2,E=c.endMin,r1=L1/h,P0=(L-L1)-r1*h;
 const e=Math.min(Math.max(el,0),c.total);
 const winDone=Math.max(0,Math.min(1,(e-(c.total-E))/E));
 return{r1,P0,E,reg:r1*(c.total-e),prem:P0*(1-winDone)};
}
function vegasAt(L,L1,t,c){const k=clockParts(L,L1,t,c);return L-(k.reg+k.prem)}
function marginBand(c,m){for(const b of c.bands){if(m<=b[0])return{label:b[1],mult:b[2],max:b[0]}}return null}
function breakEven(price){const p=+price;if(!p)return 110/210;return p<0?(-p)/(-p+100):100/(p+100)}

function project(G){
 const c=CFG[G.lg],live=G.live;
 const dk=live.dk||{};
 const L=+G.L||0,L1=+G.L1||L*c.h1share,h2=+G.h2||0;
 const lineAuto=!G.line&&live.state==='in'&&dk.live&&!G.dkStale?dk.live:0;
 const line=+G.line||lineAuto;
 const el=Math.min(live.elapsed,c.total),f=el/c.total;
 const[a,b]=live.order,A=live.teams[a],B=live.teams[b];
 const pts=A.pts+B.pts;
 const hA=G.hist[a]&&G.hist[a].l10,hB=G.hist[b]&&G.hist[b].l10;
 const w=0.75*Math.pow(f,1.15);
 const lA=liveStats(A,B,c,el,live.hasPlays),lB=liveStats(B,A,c,el,live.hasPlays);
 let method='poss',paceAdj=1,expPace=null,livePace=null,sA=null,sB=null;
 if(hA&&hB){
  expPace=(hA.pace+hB.pace)/2;
  livePace=el?((lA.pm+lB.pm)/2)/el*c.total:null;
  if(hA.spp&&hB.spp&&lA.spp&&lB.spp&&lA.pm>=4&&lB.pm>=4){
   method='spp';
   sA=hA.spp+w*(lA.spp-hA.spp);sB=hB.spp+w*(lB.spp-hB.spp);
   paceAdj=(hA.spp+hB.spp)/(sA+sB);
  }else if(livePace&&expPace){paceAdj=1+w*(livePace/expPace-1)}
 }
 const K=clockParts(L,L1,el,c);
 const vegasRem=K.reg+K.prem;
 const margin=Math.abs(A.pts-B.pts);
 const band=marginBand(c,margin);
 const endActive=el>=c.total-10&&live.state==='in';
 const em=endActive&&band?band.mult:1;
 const modelRem=K.reg*paceAdj+K.prem*em;
 const proj=pts+modelRem;
 const asIs=el?pts/el*c.total:0;
 const sdRem=c.sd*Math.sqrt(Math.max(1-f,0.0001));
 const out={L,L1,line,lineAuto:!!lineAuto,h2,el,f,pts,w,method,paceAdj,expPace,livePace,sA,sB,lA,lB,hA,hB,vegasRem,modelRem,proj,asIs,sdRem,K,margin,band,endActive,em,carryPace:K.reg*(paceAdj-1),carryEnd:K.prem*(em-1)};
 out.price=G.price||'-110';out.be=breakEven(out.price);
 if(line){out.bookRem=line-pts;out.edge=proj-line;out.pOver=1-phi((line-proj)/sdRem);
  if(!G.price&&lineAuto){const pr=out.edge>0?dk.overOdds:dk.underOdds;if(pr){out.price=(pr>0?'+':'')+pr;out.be=breakEven(pr)}}}
 if(h2&&el<=c.total/2+0.01){
  out.model2H=K.r1*(c.total/2)*paceAdj+K.P0;out.h2edge=out.model2H-h2;
  out.p2Over=1-phi((h2-out.model2H)/(c.sd*Math.sqrt(0.5)));
 }
 return out;
}

const pct=x=>x==null?'–':(x*100).toFixed(1)+'%';
const f1=x=>x==null||isNaN(x)?'–':(+x).toFixed(1);
const f2=x=>x==null||isNaN(x)?'–':(+x).toFixed(2);
const sgn=x=>(x>0?'+':'')+f1(x);
function cls(v,base,tol,invert){if(v==null||base==null)return'';const d=v-base;if(Math.abs(d)<tol)return'';return(d>0)!==!!invert?'up':'dn'}

async function loadGames(){
 const c=CFG[league];
 const dEl=document.getElementById('date');
 const d=dEl.value?dEl.value.replace(/-/g,''):ymd(new Date());
 const msg=document.getElementById('gmsg');
 msg.textContent='Loading '+c.name+' games…';
 document.getElementById('games').innerHTML='';
 try{
  const extra=league==='ncaa'?'&groups=50&limit=400':'';
  const js=await getJSON(BASE+c.path+'/scoreboard?dates='+d+extra);
  const evs=js.events||[];
  msg.textContent=evs.length+' games. Tap one to load it.';
  const order={in:0,pre:1,post:2};
  evs.sort((x,y)=>(order[x.status.type.state]-order[y.status.type.state])||new Date(x.date)-new Date(y.date));
  document.getElementById('games').innerHTML=evs.map(e=>{
   const cp=e.competitions[0];
   const away=cp.competitors.find(x=>x.homeAway==='away')||cp.competitors[0];
   const home=cp.competitors.find(x=>x.homeAway==='home')||cp.competitors[1];
   const st=e.status.type;
   const ou=(cp.odds&&cp.odds[0]&&cp.odds[0].overUnder)?' · O/U '+cp.odds[0].overUnder:'';
   const pre=st.state==='pre';
   return '<div class="g" id="g'+e.id+'" onclick="openGame(\''+e.id+'\')"><div class="st '+(st.state==='in'?'live':'')+'">'+st.shortDetail+ou+'</div>'+
    '<div class="t"><span>'+away.team.shortDisplayName+'</span><span>'+(pre?'':away.score)+'</span></div>'+
    '<div class="t"><span>'+home.team.shortDisplayName+'</span><span>'+(pre?'':home.score)+'</span></div></div>';
  }).join('');
 }catch(e){
  msg.innerHTML='<span class="err">Couldn\'t reach ESPN ('+e.message+'). Check your connection.</span>';
 }
}

async function openGame(id){
 document.querySelectorAll('.g').forEach(x=>x.classList.remove('sel'));
 const el=document.getElementById('g'+id);if(el)el.classList.add('sel');
 if(timer){clearInterval(timer);timer=null}
 const box=document.getElementById('game');
 box.innerHTML='<p class="note">Loading the live game and both teams\' last '+NGAMES+' games…</p>';
 const c=CFG[league];
 try{
  const live=await record(league,id,false);
  const saved=cacheGet('lines_'+id)||{};
  cur={lg:league,id,live,hist:{},L:saved.L||(live.dk&&live.dk.close)||live.ou||'',L1:saved.L1||'',line:saved.line||'',h2:saved.h2||'',price:saved.price&&saved.price!=='-110'?saved.price:'',log:saved.log||[]};
  logDK();
  const hs=await Promise.all(live.order.map(t=>teamHistory(league,t,id)));
  live.order.forEach((t,i)=>{cur.hist[t]={l10:agg(hs[i],c),l3:agg(hs[i].slice(-3),c),n:hs[i].length}});
  render();
  if(live.state==='in')timer=setInterval(refreshLive,45000);
 }catch(e){
  box.innerHTML='<p class="err">Couldn\'t load this game ('+e.message+').</p>';
 }
}

async function refreshLive(){

  cur.live=await record(cur.lg,cur.id,false);
  logDK();
  render();
  if(cur.live.state!=='in'&&timer){clearInterval(timer);timer=null}

function logDK(){
 const lv=cur.live,d=lv.dk;
 if(lv.state!=='in'||!d||!d.live)return;
 const[a,b]=lv.order,sc=lv.teams[a].pts+lv.teams[b].pts;
 const last=cur.log.filter(x=>x.src==='DK').slice(-1)[0];
 if(last&&+last.line===d.live){cur.dkStale=(sc-last.score)>=8;return}
 cur.dkStale=false;
 cur.log.push({t:f1(lv.elapsed),score:sc,line:d.live,src:'DK',odds:(d.overOdds||'')+'/'+(d.underOdds||'')});
 cacheSet('lines_'+cur.id,{L:cur.L,L1:cur.L1,line:cur.line,h2:cur.h2,price:cur.price,log:cur.log});
}

function saveLines(){

}

function combine(x,y,c){
 if(!x||!y)return null;
 const sum=k=>x[k]+y[k];
 const r={pts:sum('pts'),fga:sum('fga'),tpa:sum('tpa'),fta:sum('fta'),orb:sum('orb'),tov:sum('tov'),
  poss:(x.poss+y.poss)/2,spp:x.spp&&y.spp?(x.spp+y.spp)/2:null};
 const R=x.raw&&y.raw?{fgm:x.raw.fgm+y.raw.fgm,fga:x.raw.fga+y.raw.fga,tpm:x.raw.tpm+y.raw.tpm,tpa:x.raw.tpa+y.raw.tpa,ftm:x.raw.ftm+y.raw.ftm,fta:x.raw.fta+y.raw.fta,orb:x.raw.orb+y.raw.orb,tov:x.raw.tov+y.raw.tov,pts:x.raw.pts+y.raw.pts}:null;
 if(R){r.fg=R.fga?R.fgm/R.fga:null;r.tp=R.tpa?R.tpm/R.tpa:null;r.ft=R.fta?R.ftm/R.fta:null}
 r.ppp=r.poss?r.pts/(2*r.poss):null;
 r.orbp=null;r.tovp=r.poss?r.tov/(2*r.poss):null;
 return r;
}

 const hA=G.hist[a],hB=G.hist[b];
 const cA=hA&&hA.l10,cB=hB&&hB.l10,cC=combine(cA,cB,c);
 const c3=combine(hA&&hA.l3,hB&&hB.l3,c);
 const cellH=(v,v3,fmt)=>'<td class="sep">'+fmt(v)+(v3!=null?'<small>L3 '+fmt(v3)+'</small>':'')+'</td>';
 let html='<div class="layer"><h3>1 · Team averages, last '+NGAMES+' games</h3><div class="tblwrap"><table><tr><th>Per game</th><th class="sep">'+A.name+' (L'+(hA?hA.n:0)+')</th><th class="sep">'+B.name+' (L'+(hB?hB.n:0)+')</th><th class="sep">Combined</th></tr>';
 ROWS.forEach(([lab,get,fmt])=>{
  const g=(o)=>o?get(o):null;
  html+='<tr><td>'+lab+'</td>'+cellH(g(cA),g(hA&&hA.l3),fmt)+cellH(g(cB),g(hB&&hB.l3),fmt)+cellH(g(cC),g(c3),fmt)+'</tr>';
 });
 html+='<tr><td>Points allowed</td>'+cellH(cA?cA.opts:null,hA&&hA.l3?hA.l3.opts:null,f1)+cellH(cB?cB.opts:null,hB&&hB.l3?hB.l3.opts:null,f1)+'<td class="sep">–</td></tr>';
 html+='</table></div><p class="note">L3 = last 3 games. Combined = both teams added together (percentages and per-possession numbers are for both teams together).</p></div>';
 return html;
}

function boxTable(G,P,c){
 const live=G.live,[a,b]=live.order,A=live.teams[a],B=live.teams[b];
 if(live.state==='pre'||live.elapsed<=0)return'<div class="layer"><h3>2 · Tonight</h3><p class="note">The box score appears once the game starts.</p></div>';
 const lA=P.lA,lB=P.lB,hA=P.hA,hB=P.hB;
 const T={pts:A.pts+B.pts,fgm:A.fgm+B.fgm,fga:A.fga+B.fga,tpm:A.tpm+B.tpm,tpa:A.tpa+B.tpa,ftm:A.ftm+B.ftm,fta:A.fta+B.fta,orb:A.orb+B.orb,drb:A.drb+B.drb,tov:A.tov+B.tov,pf:A.pf+B.pf};
 const sh=(m,a)=>m+'-'+a+'<small>'+(a?(m/a*100).toFixed(1)+'%':'–')+'</small>';
 const pc=(v,base,tol,inv)=>cls(v,base,tol,inv);
 const f=P.el/c.total;
 const pace=(v)=>f>0?f1(v/f):'–';
 const row=(lab,va,vb,vt,extra)=>'<tr><td>'+lab+'</td><td class="sep">'+va+'</td><td class="sep">'+vb+'</td><td class="sep">'+vt+'</td>'+(extra||'')+'</tr>';
 let html='<div class="layer"><h3>2 · Tonight · box score ('+f1(P.el)+' of '+c.total+' min)</h3><div class="tblwrap"><table><tr><th>So far</th><th class="sep">'+A.name+'</th><th class="sep">'+B.name+'</th><th class="sep">Game total</th></tr>';
 html+=row('Points',A.pts+'<small>pace '+pace(A.pts)+'</small>',B.pts+'<small>pace '+pace(B.pts)+'</small>',T.pts+'<small>pace '+pace(T.pts)+'</small>');
 html+=row('Field goals',sh(A.fgm,A.fga),sh(B.fgm,B.fga),sh(T.fgm,T.fga));
 html+=row('3-pointers',sh(A.tpm,A.tpa),sh(B.tpm,B.tpa),sh(T.tpm,T.tpa));
 html+=row('Free throws',sh(A.ftm,A.fta),sh(B.ftm,B.fta),sh(T.ftm,T.fta));
 html+=row('Off. rebounds',A.orb,B.orb,T.orb);
 html+=row('Def. rebounds',A.drb,B.drb,T.drb);
 html+=row('Turnovers',A.tov+'<small>pace '+pace(A.tov)+'</small>',B.tov+'<small>pace '+pace(B.tov)+'</small>',T.tov+'<small>pace '+pace(T.tov)+'</small>');
 html+=row('Fouls',A.pf,B.pf,T.pf);
 html+=row('Possessions',f1(lA.pm)+'<small>pace '+pace(lA.pm)+'</small>',f1(lB.pm)+'<small>pace '+pace(lB.pm)+'</small>',f1((lA.pm+lB.pm)/2)+'<small>pace '+pace((lA.pm+lB.pm)/2)+'</small>');
 html+=row('Points / poss',f2(lA.ppp),f2(lB.ppp),f2(T.pts/(lA.pm+lB.pm)));
 html+=row('Sec / possession',f1(lA.spp),f1(lB.spp),lA.spp&&lB.spp?f1((lA.spp+lB.spp)/2):'–');
 html+='</table></div><p class="note">"pace" = where that number finishes if tonight\'s rate holds for the full game.</p></div>';
 html+=vsTable(G,P,c);
 return html;
}

function vsTable(G,P,c){

 });

function periodTable(G,c){
 const live=G.live,[a,b]=live.order,A=live.teams[a],B=live.teams[b];
 const per=live.periods;
 if(!per||live.state==='pre')return'';
 const keys=Object.keys(per).map(Number).sort((x,y)=>x-y);
 const pname=n=>n<=c.periods?(c.periods===2?(n===1?'1st half':'2nd half'):'Q'+n):'OT'+(n-c.periods);
 let cum=0;
 let html='<div class="layer"><h3>3 · Running totals by '+(c.periods===2?'half':'quarter')+'</h3><div class="tblwrap"><table><tr><th>Period</th><th class="sep">'+A.name+'</th><th class="sep">'+B.name+'</th><th class="sep">Total</th><th>Running</th><th class="sep">Poss</th><th>FGA</th><th>3PA</th><th>FTA</th><th>TO</th></tr>';
 keys.forEach(n=>{
  const x=per[n][a],y=per[n][b];
  const tot=x.pts+y.pts;cum+=tot;
  const ps=(poss(x,c)+poss(y,c))/2;
  html+='<tr><td>'+pname(n)+'</td><td class="sep">'+x.pts+'</td><td class="sep">'+y.pts+'</td><td class="sep"><b>'+tot+'</b></td><td>'+cum+'</td><td class="sep">'+f1(ps)+'</td><td>'+(x.fga+y.fga)+'</td><td>'+(x.tpa+y.tpa)+'</td><td>'+(x.fta+y.fta)+'</td><td>'+(x.tov+y.tov)+'</td></tr>';
 });
 html+='</table></div><p class="note">Shot and turnover counts here come from ESPN\'s play-by-play, so they can differ by one or two from the box score.</p></div>';
 return html;
}

function svgChart(series,xMax,yMax,yLabel,marks){
 const W=600,H=230,L=38,R=10,T=10,B=26;
 const x=v=>L+(W-L-R)*v/xMax,y=v=>H-B-(H-T-B)*v/yMax;
 let g='';
 const step=yMax>120?40:yMax>60?20:10;
 for(let v=0;v<=yMax;v+=step)g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#eee"/><text x="'+(L-4)+'" y="'+(y(v)+4)+'" font-size="11" text-anchor="end" fill="#777">'+v+'</text>';
 (marks||[]).forEach(m=>{g+='<line x1="'+x(m.x)+'" x2="'+x(m.x)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="#ccc" stroke-dasharray="3 3"/><text x="'+(x(m.x)+3)+'" y="'+(T+10)+'" font-size="11" fill="#777">'+m.label+'</text>'});
 g+='<text x="'+L+'" y="'+(H-6)+'" font-size="11" fill="#777">0</text><text x="'+(W-R)+'" y="'+(H-6)+'" font-size="11" fill="#777" text-anchor="end">'+xMax+' min</text>';
 series.forEach(s=>{
  if(!s.pts.length)return;
  const d=s.pts.map((p,i)=>(i?'L':'M')+x(p[0]).toFixed(1)+' '+y(p[1]).toFixed(1)).join(' ');
  g+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.w||2)+'"'+(s.dash?' stroke-dasharray="'+s.dash+'"':'')+'/>';
 });
 return'<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+yLabel+'">'+g+'</svg>';
}

function charts(G,P,c){
 const live=G.live,tl=live.timeline;
 if(!tl||tl.length<2||live.state==='pre')return'';
 const half=c.total/2;
 const vegas=P.L?[[0,0],[half,P.L1],[c.total-c.endMin,vegasAt(P.L,P.L1,c.total-c.endMin,c)],[c.total,P.L]]:[];
 const[a,b]=live.order,hA=G.hist[a]&&G.hist[a].l10,hB=G.hist[b]&&G.hist[b].l10;
 const exp=hA&&hB?((hA.pts+hB.opts)/2+(hB.pts+hA.opts)/2):null;
 const l10=exp?[[0,0],[c.total,exp]]:[];
 const actual=tl.map(p=>[Math.min(p.t,c.total),p.pts]);
 const yMax=Math.ceil(Math.max(P.L||0,exp||0,P.proj||0,...actual.map(p=>p[1]))/20)*20+10;
 const marks=[{x:half,label:'Half'}];
 if(c.periods===4){marks.push({x:12,label:'Q1'},{x:36,label:'Q3'})}
 const proj=P.L&&live.state==='in'?[[P.el,P.pts],[c.total,P.proj]]:[];
 let html='<div class="layer"><h3>4 · Charts</h3><div class="note">Total points so far vs the pace each line implies</div>';
 html+=svgChart([{pts:vegas,color:'#9aa5b1',dash:'6 4'},{pts:l10,color:'#c08a2b',dash:'2 4'},{pts:proj,color:'#2e7d32',dash:'5 3'},{pts:actual,color:'#1f3a5f',w:2.5}],c.total,yMax,'Total points over time',marks);
 html+='<div class="legend"><span style="--c:#1f3a5f">Actual total</span><span style="--c:#9aa5b1">Vegas clock (1st half, 2nd half, late bump)</span><span style="--c:#c08a2b">Teams\' L10 expected</span><span style="--c:#2e7d32">Model projection</span></div>';
 if(hA&&hB){
  const expPoss=[[0,0],[c.total,(hA.pace+hB.pace)/2]];
  const ap=tl.map(p=>[Math.min(p.t,c.total),p.poss]);
  const yM=Math.ceil(Math.max(expPoss[1][1],...ap.map(p=>p[1]))/10)*10+5;
  html+='<div class="note">Possessions so far vs the two teams\' normal pace</div>';
  html+=svgChart([{pts:expPoss,color:'#c08a2b',dash:'2 4'},{pts:ap,color:'#1f3a5f',w:2.5}],c.total,yM,'Possessions over time',marks);
  html+='<div class="legend"><span style="--c:#1f3a5f">Actual possessions</span><span style="--c:#c08a2b">L10 normal pace</span></div>';
 }
 return html+'</div>';
}

function paceBox(G,P){
 const live=G.live,[a,b]=live.order;
 if(!P.hA||!P.hB||!P.hA.spp||!P.hB.spp)return'<p class="note">Seconds per possession isn\'t available for these teams (no play-by-play from ESPN).</p>';
 if(!P.lA||!P.lA.spp||!P.lB||!P.lB.spp||live.elapsed<=0)return'';
 const line=(t,h,l)=>{
  const d=(l.spp-h.spp)/h.spp;
  const word=Math.abs(d)<0.06?'playing their normal speed':(d<0?'pushing the pace':'slowing it down');
  return'<div><b>'+live.teams[t].name+':</b> '+f1(l.spp)+' sec per trip tonight vs '+f1(h.spp)+' normally ('+(d>0?'+':'')+Math.round(d*100)+'%) → '+word+'.</div>';
 };
 return'<div class="pacebox">'+line(a,P.hA,P.lA)+line(b,P.hB,P.lB)+'</div>';
}

function projBlock(G,P,c){
 const live=G.live;
 if(!P.L)return'<p class="note">Enter the pregame total (and 1st-half total) to get a projection.</p>';
 if(live.state==='pre'||live.elapsed<=0)return'<p class="note">Game hasn\'t started. The projection appears once it\'s live.</p>';
 let html='<div class="cards">'+
  '<div class="card"><div class="l">Model: points left</div><div class="v">'+f1(P.modelRem)+'</div><div class="s">final '+f1(P.proj)+'</div></div>'+
  '<div class="card"><div class="l">Book: points left</div><div class="v">'+(P.line?f1(P.bookRem):'–')+'</div><div class="s">'+(P.line?(P.lineAuto?'DraftKings live ':'live line ')+P.line:'no live line yet')+'</div></div>'+
  '<div class="card"><div class="l">Vegas pregame: points left</div><div class="v">'+f1(P.vegasRem)+'</div><div class="s">pace adj '+f2(P.paceAdj)+'</div></div>'+
  '<div class="card"><div class="l">As-is pace (no regression)</div><div class="v">'+f1(P.asIs)+'</div><div class="s">'+P.pts+' scored</div></div></div>';
 if(P.line){
  const side=P.edge>0?'over':'under',pSide=P.edge>0?P.pOver:1-P.pOver;
  const good=pSide>P.be+0.03;
  html+='<div class="verdict '+(good?side:'')+'">Edge: <b>'+sgn(P.edge)+'</b> → leans '+side+' '+P.line+'. Chance of '+side+': <b>'+Math.round(pSide*100)+'%</b> vs break-even '+(P.be*100).toFixed(1)+'% at '+P.price+(P.lineAuto?' (DraftKings)':'')+'. Likely final range '+f1(P.proj-P.sdRem)+'–'+f1(P.proj+P.sdRem)+'.</div>';
 }else html+='<p class="note">Enter the live line to see the edge and the chance of over/under.</p>';
 if(P.model2H!=null){
  const s2=P.h2edge>0?'over':'under',p2=P.h2edge>0?P.p2Over:1-P.p2Over;
  html+='<div class="verdict '+(p2>P.be+0.03?s2:'')+'">2nd half: model <b>'+f1(P.model2H)+'</b> vs line '+P.h2+' → '+sgn(P.h2edge)+', leans '+s2+'. Chance '+Math.round(p2*100)+'%.</div>';
 }
 html+='<p class="note">'+f1(P.el)+' of '+c.total+' min played · live weight '+Math.round(P.w*100)+'% · pace from '+(P.method==='spp'?'seconds per possession (each team regressed separately)':'possessions')+'.</p>';
 if(P.el<c.total/4)html+='<p class="note"><b>Early:</b> under a quarter played. Live numbers are mostly noise; the model leans on the pregame line.</p>';
 const lA=P.lA,lB=P.lB,hA=P.hA,hB=P.hB;
 if(hA&&hB){
  if((lA.orbp>hA.orbp+0.08)||(lB.orbp>hB.orbp+0.08))html+='<p class="note"><b>Offensive-rebound check:</b> a team is grabbing its misses well above normal, so shot counts overstate pace. The model uses possessions and seconds per trip, which correct for it.</p>';
  if((lA.tovp>hA.tovp*1.5&&lA.tovp>0.15)||(lB.tovp>hB.tovp*1.5&&lB.tovp>0.15))html+='<p class="note"><b>Turnover check:</b> a team is turning it over at 1.5× its normal rate or more.'+(G.lg==='ncaa'?' In college, watch for that team slowing down after halftime.':'')+'</p>';
 }
 if(G.log.length){
  html+='<h3>Live line history</h3><div class="tblwrap"><table><tr><th>Min played</th><th>Score total</th><th>Line</th><th>Book pts left</th><th>Price o/u</th><th>Source</th></tr>'+
   G.log.map(x=>'<tr><td>'+x.t+'</td><td>'+x.score+'</td><td>'+x.line+'</td><td>'+f1(x.line-x.score)+'</td><td>'+(x.odds||'')+'</td><td>'+(x.src==='DK'?'DraftKings':'You')+'</td></tr>').join('')+'</table></div>';
 }
 return html;
}

function tripSplit(t,poss,h,c){
 const r=h.raw,pn=h.myPoss;
 const p2=(r.fga-r.tpa)?(r.fgm-r.tpm)/(r.fga-r.tpa):0,p3=r.tpa?r.tpm/r.tpa:0,pft=r.fta?r.ftm/r.fta:0;
 const v2=2*p2,v3=3*p3,vF=pft;
 const tn=r.tov/pn,on=r.orb/pn,fn=r.fta/pn,s3n=r.fga?r.tpa/r.fga:0;
 const vSn=s3n*v3+(1-s3n)*v2;
 const tl=t.tov/poss,ol=t.orb/poss,fl=t.fta/poss,s3l=t.fga?t.tpa/t.fga:0,FGAl=t.fga/poss;
 const tov=-(tl-tn)*vSn*poss;
 const orb=(ol-on)*vSn*poss;
 const ft=(fl-fn)*(vF-c.ftc*vSn)*poss;
 const mix=FGAl*(s3l-s3n)*(v3-v2)*poss;
 const l2=((t.fgm-t.tpm)-(t.fga-t.tpa)*p2)*2,l3=(t.tpm-t.tpa*p3)*3,lft=t.ftm-t.fta*pft;
 return{tov,orb,ft,mix,l2,l3,lft,luck:l2+l3+lft,
  tovN:tn*poss,orbN:on*poss,ftaN:fn*poss,s3n,s3l,ppp:h.ppp};
}

function breakdown(G,P,c){
 const live=G.live,[a,b]=live.order;
 if(!P.L||live.state==='pre'||P.el<=0||!P.hA||!P.hB||!P.expPace||!P.hA.myPoss||!P.hB.myPoss)return null;
 const vegasSoFar=P.L-P.vegasRem;
 const D=P.pts-vegasSoFar;
 const share=vegasSoFar/P.L;
 const expPoss=P.expPace*share;
 const A=live.teams[a],B=live.teams[b];
 const pA=P.lA.pm,pB=P.lB.pm;
 const pace=(pA-expPoss)*P.hA.ppp+(pB-expPoss)*P.hB.ppp;
 const base=expPoss*(P.hA.ppp+P.hB.ppp)-vegasSoFar;
 const TA=tripSplit(A,pA,P.hA,c),TB=tripSplit(B,pB,P.hB,c);
 const sum=k=>TA[k]+TB[k];
 const out={vegasSoFar,D,expPoss,possSoFar:(pA+pB)/2,pace,base,TA,TB,
  tov:sum('tov'),ft:sum('ft'),mix:sum('mix'),orb:sum('orb'),luck:sum('luck')};
 out.check=D-(pace+base+out.tov+out.ft+out.mix+out.orb+out.luck);
 return out;
}

function sidePanel(G,P,c){
 const live=G.live,[a,b]=live.order,nA=live.teams[a].name,nB=live.teams[b].name;
 let h='<div class="side"><h3>Why the model says '+(P.L&&live.state!=='pre'&&P.el>0?f1(P.proj):'–')+'</h3>';
 const B=breakdown(G,P,c);
 if(!B){return h+'<p class="note">'+(!P.L?'Needs the pregame total.':live.state==='pre'?'Appears once the game starts.':'Waiting for both teams\' history to load.')+'</p></div>'}
 const vals=[B.pace,B.tov,B.ft,B.mix,B.orb,B.luck,B.base,P.carryPace,P.carryEnd];
 const mx=Math.max(4,...vals.map(Math.abs));
 const bar=v=>{const w=Math.min(50,Math.abs(v)/mx*50);return'<div class="bar"><i style="'+(v>=0?'left:50%':'right:50%')+';width:'+w+'%;background:'+(v>=0?'#2e7d32':'#b42318')+'"></i></div>'};
 const row=(lab,sub,v,cls)=>'<div class="bk '+(cls||'')+'"><div class="lab">'+lab+(sub?'<small>'+sub+'</small>':'')+'</div>'+(v==null?'<div></div><div class="val">–</div>':bar(v)+'<div class="val" style="color:'+(v>=0?'#2e7d32':'#b42318')+'">'+sgn(v)+'</div>')+'</div>';
 const plain=(lab,sub,txt,cls)=>'<div class="bk '+(cls||'')+'"><div class="lab">'+lab+(sub?'<small>'+sub+'</small>':'')+'</div><div></div><div class="val">'+txt+'</div></div>';
 h+=plain('Vegas pregame total','DraftKings close / your entry',f1(P.L),'');
 h+='<div class="sec">So far · '+f1(P.el)+' of '+c.total+' min</div>';
 h+=plain('Points so far vs Vegas pace',P.pts+' scored vs '+f1(B.vegasSoFar)+' expected by now',sgn(B.D),'sub');
 h+=row('Pace',f1(B.possSoFar)+' trips each vs '+f1(B.expPoss)+' on the Vegas clock',B.pace);
 const A=live.teams[a],Bt=live.teams[b],TA=B.TA,TB=B.TB;
 h+='<div class="sec">How trips ended</div>';
 h+=row('Turnovers',nA+' '+A.tov+' vs '+f1(TA.tovN)+' normal · '+nB+' '+Bt.tov+' vs '+f1(TB.tovN),B.tov);
 h+=row('Free-throw trips (net of shots)',nA+' '+A.fta+' FTA vs '+f1(TA.ftaN)+' · '+nB+' '+Bt.fta+' vs '+f1(TB.ftaN),B.ft);
 h+=row('Threes vs twos',nA+' '+Math.round(TA.s3l*100)+'% threes vs '+Math.round(TA.s3n*100)+'% · '+nB+' '+Math.round(TB.s3l*100)+'% vs '+Math.round(TB.s3n*100)+'%',B.mix);
 h+=row('Second chances',nA+' '+A.orb+' off. reb vs '+f1(TA.orbN)+' · '+nB+' '+Bt.orb+' vs '+f1(TB.orbN),B.orb);
 h+='<div class="sec">How well they converted</div>';
 const lt=(n,L)=>n+': 2s '+sgn(L.l2)+', 3s '+sgn(L.l3)+', FT '+sgn(L.lft);
 h+=row('Shooting luck',lt(nA,TA)+'<br>'+lt(nB,TB),B.luck);
 h+=row('Teams\' normal scoring vs Vegas','teams usually score '+f2((P.hA.ppp+P.hB.ppp)/2)+'/trip, Vegas line implies '+f2(P.L/(2*P.expPace)),B.base);
 if(Math.abs(B.check)>0.5)h+=plain('Unexplained','should be ~0; if not, the math is off',sgn(B.check),'sub');
 h+='<div class="sec">Rest of game</div>';
 h+=row('Pace carried forward',Math.round(P.w*100)+'% of tonight\'s speed kept · '+f1(P.vegasRem)+' Vegas pts left',P.carryPace);
 h+=plain('Shooting','resets to each team\'s normal','0.0','sub');
 h+=row('End of game (fouling)',P.endActive&&P.band?'margin '+P.margin+' → '+P.band.label+' (×'+P.band.mult+' on Vegas\'s late bump)':'Vegas\'s average ending; margin rule starts with 10 min left',P.carryEnd);
 h+=plain('<b>Model final</b>','',f1(P.proj),'tot');
 if(P.line){
  const side=P.edge>0?'over':'under',pSide=P.edge>0?P.pOver:1-P.pOver;
  h+=plain((P.lineAuto?'DraftKings live':'Live line'),'price '+P.price+' · break-even '+(P.be*100).toFixed(1)+'%',f1(P.line),'');
  h+='<div class="verdict '+(pSide>P.be+0.03?side:'')+'" style="margin-top:8px">Edge <b>'+sgn(P.edge)+'</b> → '+side+' · chance '+Math.round(pSide*100)+'%</div>';
 }else h+='<p class="note">No live line yet.</p>';
 h+='<p class="note">Bars show how many points each effect adds (green) or takes away (red) vs the Vegas pregame total. Every trip is counted once by how it ended, so fewer free throws or turnovers show up as extra shots, netted automatically. The rows add up exactly to points so far vs Vegas.</p>';
 return h+'</div>';
}

function render(){
 const G=cur,c=CFG[G.lg],live=G.live,[a,b]=live.order,A=live.teams[a],B=live.teams[b];
 const away=A.homeAway==='away'?A:B,home=A.homeAway==='away'?B:A,pre=live.state==='pre';
 const P=project(G);
 let html='<h2>'+away.name+' '+(pre?'':away.pts)+' @ '+home.name+' '+(pre?'':home.pts)+' <span class="note">· '+live.detail+'</span></h2>';
 const inp=(k,lab,ph)=>'<div><label>'+lab+'</label><input id="i_'+k+'" inputmode="decimal" placeholder="'+(ph||'')+'" value="'+(G[k]||'')+'" onchange="saveLines()"></div>';
 const dk=live.dk;
 html+='<div class="lines">'+inp('L','Pregame total')+inp('L1','1st-half total',G.L?f1(G.L*c.h1share):'')+inp('line','Live total',dk&&dk.live&&live.state==='in'?'DK '+dk.live:'')+inp('h2','2nd-half line')+inp('price','Price',dk&&dk.overOdds&&live.state==='in'?'DK':'-110')+'</div>';
 if(dk){
  const o=v=>v==null?'–':(v>0?'+'+v:v);
  html+='<div class="dkbar">'+dk.prov+': '+(live.state==='in'&&dk.live?'live <b>'+dk.live+'</b> (over '+o(dk.overOdds)+' / under '+o(dk.underOdds)+') · ':'')+'pregame close '+(dk.close||'–')+' · open '+(dk.open||'–')+(live.state==='in'?' · updates every 45s':'')+'<br><span class="note">Live total and price fill in from DraftKings automatically. Type your own to override; clear the box to go back to DraftKings. Confirm the line in the DraftKings app before betting.</span></div>';
 }
 {const P0=project(G);const K=P0.K;
  if(P0.L){
   const h2=P0.L-P0.L1,gap=h2-P0.L1;
   html+='<div class="vbox"><div><div class="l">Full game</div><div class="v">'+f1(P0.L)+'</div></div>'+
    '<div><div class="l">1st half</div><div class="v">'+f1(P0.L1)+'</div><div class="s">'+(G.L1?'your line':'estimate · enter the real line')+'</div></div>'+
    '<div><div class="l">2nd half (implied)</div><div class="v">'+f1(h2)+'</div><div class="s">'+(gap>=0?'+':'')+f1(gap)+' vs 1st half</div></div>'+
    '<div><div class="l">Vegas clock</div><div class="v">'+f1(K.r1)+' → '+f1(K.r1+K.P0/K.E)+'</div><div class="s">pts/min normal → last '+K.E+' min</div></div></div>';
  }
  if(live.state==='in'&&P0.band&&P0.endActive)html+='<div class="warn">Endgame: margin '+P0.margin+' → <b>'+P0.band.label+'</b>. Late bump from Vegas × '+P0.band.mult+' (starting guess; adjust as we learn).'+(P0.band.label==='fouling range'?' Expect fouling and free throws.':P0.band.label==='close'?' Close game: fouling usually waits until the last minute.':' Blowout: expect benches and a slower finish.')+'</div>';
  if(live.state==='in'&&G.dkStale&&!G.line)html+='<div class="warn">ESPN\'s DraftKings line hasn\'t moved while the score did. It looks stale, so it\'s not being used. Type the live line from the DraftKings app.</div>';
 }
 html+='<div class="row"><button onclick="refreshLive()">Refresh live</button><span class="note">Auto-refreshes every 45s while live.</span></div>';
 html+='<div class="wrap"><div>'+avgTable(G,c)+boxTable(G,P,c)+paceBox(G,P)+periodTable(G,c)+charts(G,P,c)+'<div class="layer"><h3>5 · Model (draft, logic still being built)</h3>'+projBlock(G,P,c)+'</div></div>'+sidePanel(G,P,c)+'</div>';
 const active=document.activeElement&&document.activeElement.id;
 document.getElementById('game').innerHTML=html;
 if(active&&document.getElementById(active))document.getElementById(active).focus();
}
