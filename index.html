<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Totals Hub</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:#111;font-size:15px}
header{background:#1f3a5f;color:#fff;padding:12px 14px}
header h1{margin:0;font-size:18px;font-weight:600}
header .sub{font-size:12px;opacity:.85;margin-top:2px}
main{padding:12px 14px;max-width:820px;margin:0 auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
button{font:inherit;padding:8px 12px;border:1px solid #1f3a5f;background:#fff;color:#1f3a5f;border-radius:6px;cursor:pointer}
button.on{background:#1f3a5f;color:#fff}
input{font:inherit;padding:7px 8px;border:1px solid #bbb;border-radius:6px;width:100%}
input[type=date]{width:auto}
label{font-size:12px;color:#555;display:block;margin-bottom:3px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-bottom:14px}
.g{border:1px solid #ddd;border-radius:8px;padding:8px 10px;cursor:pointer}
.g.sel{border:2px solid #1f3a5f}
.g .st{font-size:12px;color:#666}
.g .t{display:flex;justify-content:space-between}
.live{color:#b42318;font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.card{background:#f4f6f9;border-radius:8px;padding:9px 11px}
.card .l{font-size:12px;color:#555}
.card .v{font-size:21px;font-weight:600}
.verdict{border:1px solid #ddd;border-radius:8px;padding:10px 12px;margin:8px 0;font-size:15px}
.verdict.over{border-color:#2e7d32;background:#f1f8f1}
.verdict.under{border-color:#b42318;background:#fdf3f2}
table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 14px}
th{background:#1f3a5f;color:#fff;font-weight:600;padding:6px 5px;text-align:right}
th:first-child,td:first-child{text-align:left}
td{padding:5px;border-bottom:1px solid #eee;text-align:right}
.up{color:#2e7d32;font-weight:600}
.dn{color:#b42318;font-weight:600}
.note{font-size:12px;color:#666;margin:4px 0}
.err{color:#b42318;font-size:13px;margin:8px 0}
h2{font-size:16px;margin:16px 0 6px}
.tblwrap{overflow-x:auto}
</style>
</head>
<body>
<header>
<h1>Live totals hub</h1>
<div class="sub">Over/under model · v1 · data from ESPN</div>
</header>
<main>
<div class="row">
<button id="bNcaa" class="on" onclick="setLeague('ncaa')">College (men)</button>
<button id="bNba" onclick="setLeague('nba')">NBA</button>
<input type="date" id="date">
<button onclick="loadGames()">Load games</button>
</div>
<div id="gmsg" class="note"></div>
<div class="games" id="games"></div>
<div id="game"></div>
</main>
<script>
const CFG={
 nba:{path:'basketball/nba',periods:4,plen:12,total:48,ot:5,ftc:0.44,sd:17,h1share:0.5,name:'NBA'},
 ncaa:{path:'basketball/mens-college-basketball',periods:2,plen:20,total:40,ot:5,ftc:0.475,sd:15,h1share:0.47,name:'College'}
};
const BASE='https://site.api.espn.com/apis/site/v2/sports/';
let league='ncaa', cur=null, timer=null;
const memo={};

function cacheGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function cacheSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

async function getJSON(url){
 const r=await fetch(url);
 if(!r.ok) throw new Error('HTTP '+r.status);
 return r.json();
}

function ymd(d){return d.toISOString().slice(0,10).replace(/-/g,'')}
function setLeague(l){
 league=l;
 document.getElementById('bNcaa').classList.toggle('on',l==='ncaa');
 document.getElementById('bNba').classList.toggle('on',l==='nba');
 loadGames();
}

function teamStat(stats,names){
 for(const n of names){
  const s=stats.find(x=>x.name===n);
  if(s&&s.displayValue!==undefined&&s.displayValue!=='') return s.displayValue;
 }
 return null;
}
function pair(v){if(!v)return[0,0];const p=String(v).split('-');return[+p[0]||0,+p[1]||0]}
function num(v){return v==null?0:(parseFloat(v)||0)}

function parseTeamBox(t){
 const s=t.statistics||[];
 const fg=pair(teamStat(s,['fieldGoalsMade-fieldGoalsAttempted']));
 const tp=pair(teamStat(s,['threePointFieldGoalsMade-threePointFieldGoalsAttempted']));
 const ft=pair(teamStat(s,['freeThrowsMade-freeThrowsAttempted']));
 return{
  id:String(t.team.id),abbr:t.team.abbreviation||t.team.shortDisplayName,name:t.team.shortDisplayName||t.team.displayName,
  fgm:fg[0],fga:fg[1],tpm:tp[0],tpa:tp[1],ftm:ft[0],fta:ft[1],
  orb:num(teamStat(s,['offensiveRebounds'])),drb:num(teamStat(s,['defensiveRebounds'])),
  tov:num(teamStat(s,['totalTurnovers','turnovers'])),pf:num(teamStat(s,['fouls','totalFouls']))
 };
}

function elapsedMin(c,status){
 const st=status.type||{};
 if(st.state==='pre')return 0;
 const p=status.period||1;
 const clk=(status.clock!=null)?status.clock/60:0;
 if(st.state==='post'||st.completed){
  return p<=c.periods?c.total:c.total+(p-c.periods)*c.ot;
 }
 if(p<=c.periods)return (p-1)*c.plen+(c.plen-clk);
 return c.total+(p-c.periods-1)*c.ot+(c.ot-clk);
}

function parseSummary(sum,c){
 const comp=sum.header.competitions[0];
 const status=comp.status||sum.header.competitions[0].status;
 const teams={};
 (sum.boxscore&&sum.boxscore.teams||[]).forEach(t=>{const b=parseTeamBox(t);teams[b.id]=b});
 const order=[];
 comp.competitors.forEach(cp=>{
  const id=String(cp.id||cp.team.id);
  if(!teams[id])teams[id]={id,abbr:cp.team.abbreviation,name:cp.team.shortDisplayName||cp.team.displayName,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,orb:0,drb:0,tov:0,pf:0};
  teams[id].pts=num(cp.score);teams[id].homeAway=cp.homeAway;order.push(id);
 });
 let ou=null;
 (sum.pickcenter||[]).forEach(p=>{if(ou==null&&p.overUnder)ou=+p.overUnder});
 return{teams,order,status,state:(status.type||{}).state,detail:(status.type||{}).shortDetail||'',elapsed:elapsedMin(c,status),date:comp.date,ou};
}

function poss(t,c){return t.fga+c.ftc*t.fta-t.orb+t.tov}

async function summary(lg,id,final){
 const k='sum_'+lg+'_'+id;
 if(final){const hit=memo[k]||cacheGet(k);if(hit)return hit}
 const js=await getJSON(BASE+CFG[lg].path+'/summary?event='+id);
 const slim={header:js.header,boxscore:{teams:(js.boxscore&&js.boxscore.teams)||[]},pickcenter:js.pickcenter||[]};
 const st=((slim.header.competitions[0].status||{}).type)||{};
 if(st.completed){memo[k]=slim;cacheSet(k,slim)}
 return slim;
}

async function pool(items,n,fn){
 const out=[];let i=0;
 async function w(){while(i<items.length){const k=i++;try{out[k]=await fn(items[k])}catch(e){out[k]=null}}}
 await Promise.all(Array.from({length:n},w));
 return out;
}

async function teamHistory(lg,teamId,excludeId){
 const c=CFG[lg];
 const js=await getJSON(BASE+c.path+'/teams/'+teamId+'/schedule');
 const evs=(js.events||[]).filter(e=>{
  const st=(e.competitions&&e.competitions[0].status&&e.competitions[0].status.type)||{};
  return st.completed&&String(e.id)!==String(excludeId);
 }).sort((a,b)=>new Date(a.date)-new Date(b.date));
 const sums=await pool(evs.map(e=>e.id),4,id=>summary(lg,id,true));
 const games=[];
 sums.forEach(s=>{
  if(!s)return;
  const p=parseSummary(s,c);
  const me=p.teams[String(teamId)];
  const oppId=p.order.find(x=>x!==String(teamId));
  const op=p.teams[oppId];
  if(!me||!op||!me.fga||!op.fga)return;
  games.push({date:p.date,me,op,mins:p.elapsed||c.total,poss:(poss(me,c)+poss(op,c))/2});
 });
 return games;
}

function agg(games,c){
 if(!games.length)return null;
 const S={pts:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,orb:0,tov:0,oppDrb:0,oPts:0,oFgm:0,oFga:0,oTpm:0,oTpa:0,oFta:0,oOrb:0,oTov:0,myDrb:0,poss:0,mins:0};
 games.forEach(g=>{
  const m=g.me,o=g.op;
  S.pts+=m.pts;S.fgm+=m.fgm;S.fga+=m.fga;S.tpm+=m.tpm;S.tpa+=m.tpa;S.ftm+=m.ftm;S.fta+=m.fta;S.orb+=m.orb;S.tov+=m.tov;S.oppDrb+=o.drb;
  S.oPts+=o.pts;S.oFgm+=o.fgm;S.oFga+=o.fga;S.oTpm+=o.tpm;S.oTpa+=o.tpa;S.oFta+=o.fta;S.oOrb+=o.orb;S.oTov+=o.tov;S.myDrb+=m.drb;
  S.poss+=g.poss;S.mins+=g.mins;
 });
 return metrics(S,c,games.length);
}

function metrics(S,c,n){
 const d=(a,b)=>b?a/b:0;
 return{
  n,
  pace:d(S.poss,S.mins)*c.total,
  ppp:d(S.pts,S.poss),
  fg:d(S.fgm,S.fga),tp:d(S.tpm,S.tpa),
  tpar:d(S.tpa,S.fga),ftr:d(S.fta,S.fga),
  orb:d(S.orb,S.orb+S.oppDrb),
  tov:d(S.tov,S.poss),
  ppg:d(S.pts,n),
  oppp:d(S.oPts,S.poss),ofg:d(S.oFgm,S.oFga),otp:d(S.oTpm,S.oTpa),otpar:d(S.oTpa,S.oFga),otov:d(S.oTov,S.poss),
  oppg:d(S.oPts,n)
 };
}

function liveMetrics(me,op,c,elapsed){
 const P=(poss(me,c)+poss(op,c))/2;
 const S={pts:me.pts,fgm:me.fgm,fga:me.fga,tpm:me.tpm,tpa:me.tpa,ftm:me.ftm,fta:me.fta,orb:me.orb,tov:me.tov,oppDrb:op.drb,
  oPts:op.pts,oFgm:op.fgm,oFga:op.fga,oTpm:op.tpm,oTpa:op.tpa,oFta:op.fta,oOrb:op.orb,oTov:op.tov,myDrb:me.drb,poss:P,mins:elapsed};
 const m=metrics(S,c,1);
 m.fgaPace=elapsed?(me.fga+op.fga)/elapsed*c.total:0;
 return m;
}

function phi(z){const t=1/(1+0.2316419*Math.abs(z));const d=0.3989423*Math.exp(-z*z/2);const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}

function remImplied(L,L1,el,c){
 const h=c.total/2;
 if(el>=c.total)return 0;
 if(el<h)return L1*(h-el)/h+(L-L1);
 return (L-L1)*(c.total-el)/h;
}

function project(G){
 const c=CFG[G.lg];
 const L=+G.L||0,L1=+G.L1||L*c.h1share,line=+G.line||L;
 const el=Math.min(G.live.elapsed,c.total);
 const f=el/c.total;
 const [a,b]=G.live.order;
 const A=G.live.teams[a],B=G.live.teams[b];
 const pts=A.pts+B.pts;
 const expPace=(G.hist[a]&&G.hist[b])?(G.hist[a].season.pace+G.hist[b].season.pace)/2:0;
 const livePace=el?((poss(A,c)+poss(B,c))/2)/el*c.total:0;
 const w=0.75*Math.pow(f,1.15);
 const paceRatio=expPace&&livePace?livePace/expPace:1;
 const paceAdj=1+w*(paceRatio-1);
 const rem=remImplied(L,L1,el,c);
 const proj=pts+rem*paceAdj;
 const asIs=el?pts/el*c.total:0;
 const sdRem=c.sd*Math.sqrt(Math.max(1-f,0.0001));
 const pOver=1-phi((line-proj)/sdRem);
 return{L,L1,line,el,f,pts,expPace,livePace,paceRatio,w,paceAdj,rem,proj,asIs,sdRem,pOver,edge:proj-line};
}

function pct(x){return (x*100).toFixed(1)+'%'}
function f1(x){return (+x).toFixed(1)}
function f2(x){return (+x).toFixed(2)}
function cmpCell(live,base,fmt,tol){
 if(base==null||live==null)return '<td>–</td>';
 const d=live-base;
 const cls=Math.abs(d)<tol?'':(d>0?'up':'dn');
 return '<td class="'+cls+'">'+fmt(live)+'</td>';
}

async function loadGames(){
 const c=CFG[league];
 const dEl=document.getElementById('date');
 const d=dEl.value?dEl.value.replace(/-/g,''):ymd(new Date());
 const msg=document.getElementById('gmsg');
 msg.textContent='Loading '+c.name+' games…';
 document.getElementById('games').innerHTML='';
 try{
  const extra=league==='ncaa'?'&groups=50&limit=400':'';
  const js=await getJSON(BASE+c.path+'/scoreboard?dates='+d+extra);
  const evs=js.events||[];
  msg.textContent=evs.length+' games. Tap one to load it.';
  const order={in:0,pre:1,post:2};
  evs.sort((x,y)=>(order[x.status.type.state]-order[y.status.type.state])||new Date(x.date)-new Date(y.date));
  document.getElementById('games').innerHTML=evs.map(e=>{
   const cp=e.competitions[0];
   const away=cp.competitors.find(x=>x.homeAway==='away')||cp.competitors[0];
   const home=cp.competitors.find(x=>x.homeAway==='home')||cp.competitors[1];
   const st=e.status.type;
   const ou=(cp.odds&&cp.odds[0]&&cp.odds[0].overUnder)?' · O/U '+cp.odds[0].overUnder:'';
   const sc=st.state==='pre'?'':away.score;
   const sc2=st.state==='pre'?'':home.score;
   return '<div class="g" id="g'+e.id+'" onclick="openGame(\''+e.id+'\')"><div class="st '+(st.state==='in'?'live':'')+'">'+st.shortDetail+ou+'</div>'+
    '<div class="t"><span>'+away.team.shortDisplayName+'</span><span>'+sc+'</span></div>'+
    '<div class="t"><span>'+home.team.shortDisplayName+'</span><span>'+sc2+'</span></div></div>';
  }).join('');
 }catch(e){
  msg.innerHTML='<span class="err">Couldn\'t reach ESPN ('+e.message+'). Open this file in Safari or Chrome rather than inside a preview, and check your connection.</span>';
 }
}

async function openGame(id){
 document.querySelectorAll('.g').forEach(x=>x.classList.remove('sel'));
 const el=document.getElementById('g'+id);if(el)el.classList.add('sel');
 if(timer){clearInterval(timer);timer=null}
 const box=document.getElementById('game');
 box.innerHTML='<p class="note">Loading box score and both teams\' season games…</p>';
 const c=CFG[league];
 try{
  const live=parseSummary(await summary(league,id,false),c);
  const saved=cacheGet('lines_'+id)||{};
  cur={lg:league,id,live,hist:{},L:saved.L||live.ou||'',L1:saved.L1||'',line:saved.line||''};
  const hs=await Promise.all(live.order.map(t=>teamHistory(league,t,id)));
  live.order.forEach((t,i)=>{
   const g=hs[i];
   cur.hist[t]={season:agg(g,c),last3:agg(g.slice(-3),c),games:g.length};
  });
  render();
  if(live.state==='in')timer=setInterval(refreshLive,45000);
 }catch(e){
  box.innerHTML='<p class="err">Couldn\'t load this game ('+e.message+').</p>';
 }
}

async function refreshLive(){
 if(!cur)return;
 try{
  cur.live=parseSummary(await summary(cur.lg,cur.id,false),CFG[cur.lg]);
  render();
  if(cur.live.state!=='in'&&timer){clearInterval(timer);timer=null}
 }catch(e){}
}

function saveLines(){
 cur.L=document.getElementById('iL').value;
 cur.L1=document.getElementById('iL1').value;
 cur.line=document.getElementById('iLine').value;
 cacheSet('lines_'+cur.id,{L:cur.L,L1:cur.L1,line:cur.line});
 render(true);
}

function teamTable(G,tid,oid,c){
 const h=G.hist[tid],live=G.live,me=live.teams[tid],op=live.teams[oid];
 const s=h.season,l3=h.last3;
 const lv=live.elapsed>0&&me.fga?liveMetrics(me,op,c,live.elapsed):null;
 const rows=[
  ['Pace (poss/'+c.total+')',x=>x.pace,f1,1.5],
  ['Points per poss',x=>x.ppp,f2,0.04],
  ['FG%',x=>x.fg,pct,0.03],
  ['3P%',x=>x.tp,pct,0.04],
  ['3PA share of FGA',x=>x.tpar,pct,0.04],
  ['FTA per FGA',x=>x.ftr,pct,0.05],
  ['Off. rebound %',x=>x.orb,pct,0.04],
  ['Turnovers per poss',x=>x.tov,pct,0.03],
  ['Opp points per poss',x=>x.oppp,f2,0.04],
  ['Opp 3PA share',x=>x.otpar,pct,0.04],
  ['Opp turnovers per poss',x=>x.otov,pct,0.03]
 ];
 if(!s)return '<p class="note">No completed games found for '+me.name+' yet.</p>';
 let html='<div class="tblwrap"><table><tr><th>'+me.name+' ('+h.games+' g)</th><th>Season</th><th>Last 3</th><th>Live</th></tr>';
 rows.forEach(r=>{
  html+='<tr><td>'+r[0]+'</td><td>'+r[2](r[1](s))+'</td>'+cmpCell(l3?r[1](l3):null,r[1](s),r[2],r[3])+(lv?cmpCell(r[1](lv),r[1](s),r[2],r[3]):'<td>–</td>')+'</tr>';
 });
 html+='<tr><td>Points per game</td><td>'+f1(s.ppg)+'</td><td>'+(l3?f1(l3.ppg):'–')+'</td><td>'+me.pts+'</td></tr>';
 html+='<tr><td>Allowed per game</td><td>'+f1(s.oppg)+'</td><td>'+(l3?f1(l3.oppg):'–')+'</td><td>–</td></tr>';
 return html+'</table></div>';
}

function render(keepInputs){
 const G=cur,c=CFG[G.lg],live=G.live;
 const [a,b]=live.order;
 const A=live.teams[a],B=live.teams[b];
 const away=A.homeAway==='away'?A:B,home=A.homeAway==='away'?B:A;
 let html='<h2>'+away.name+' '+(live.state==='pre'?'':away.pts)+' @ '+home.name+' '+(live.state==='pre'?'':home.pts)+' <span class="note">· '+live.detail+'</span></h2>';
 html+='<div class="grid3"><div><label>Pregame total</label><input id="iL" inputmode="decimal" value="'+G.L+'" onchange="saveLines()"></div>'+
  '<div><label>1st-half total</label><input id="iL1" inputmode="decimal" placeholder="'+(G.L?f1(G.L*c.h1share):'')+'" value="'+G.L1+'" onchange="saveLines()"></div>'+
  '<div><label>Live total line</label><input id="iLine" inputmode="decimal" placeholder="'+(G.L||'')+'" value="'+G.line+'" onchange="saveLines()"></div></div>';
 html+='<div class="row"><button onclick="refreshLive()">Refresh live</button><span class="note">Auto-refreshes every 45s while live.</span></div>';
 if(!G.L){
  html+='<p class="note">Enter the pregame total (and 1st-half total) to get a projection.</p>';
 }else if(live.state==='pre'||live.elapsed<=0){
  html+='<p class="note">Game hasn\'t started. Projection appears once it\'s live.</p>';
 }else{
  const P=project(G);
  const early=P.el<c.total/4;
  html+='<div class="cards">'+
   '<div class="card"><div class="l">Projected final</div><div class="v">'+f1(P.proj)+'</div></div>'+
   '<div class="card"><div class="l">Chance of over '+P.line+'</div><div class="v">'+Math.round(P.pOver*100)+'%</div></div>'+
   '<div class="card"><div class="l">Real pace vs expected</div><div class="v">'+(P.expPace?Math.round(P.paceRatio*100)+'%':'–')+'</div></div>'+
   '<div class="card"><div class="l">As-is pace (no regression)</div><div class="v">'+f1(P.asIs)+'</div></div>'+
   '</div>';
  const side=P.edge>0?'over':'under';
  html+='<div class="verdict '+(Math.abs(P.edge)>=3?side:'')+'">Edge vs live line: <b>'+(P.edge>0?'+':'')+f1(P.edge)+'</b> → leans '+side+'. '+
   'Likely range of the final: '+f1(P.proj-P.sdRem)+' to '+f1(P.proj+P.sdRem)+'. Break-even at −110 is 52.4%.</div>';
  html+='<p class="note">'+f1(P.el)+' of '+c.total+' min played · live weight '+Math.round(P.w*100)+'% · Vegas-implied points left '+f1(P.rem)+' × pace adj '+f2(P.paceAdj)+' · '+P.pts+' already scored'+(G.L1?'':' · 1st-half total assumed at '+Math.round(c.h1share*100)+'% of game')+'.</p>';
  if(early)html+='<p class="note"><b>Early:</b> under a quarter of the game played. Live numbers are mostly noise; the model leans on the pregame line.</p>';
  const lA=liveMetrics(A,B,c,P.el),lB=liveMetrics(B,A,c,P.el);
  const fgaPace=lA.fgaPace,possPace=P.livePace;
  const hA=G.hist[a],hB=G.hist[b];
  if(hA&&hA.season&&hB&&hB.season){
   const orbHot=(lA.orb>hA.season.orb+0.06)||(lB.orb>hB.season.orb+0.06);
   if(orbHot)html+='<p class="note"><b>Offensive-rebound check:</b> at least one team is rebounding its misses well above normal, so shot counts overstate pace. The pace number above uses possessions, which corrects for it.</p>';
   const tovHot=(lA.tov>hA.season.tov*1.5&&lA.tov>0.15)||(lB.tov>hB.season.tov*1.5&&lB.tov>0.15);
   if(tovHot)html+='<p class="note"><b>Turnover check:</b> a team is turning it over at 1.5× its normal rate or more.'+(G.lg==='ncaa'?' In college, watch for that team slowing down after halftime.':'')+'</p>';
  }
 }
 html+='<h2>Team breakdown</h2><p class="note">Last 3 and Live are colored against the season: green above, red below.</p>';
 html+=teamTable(G,a,b,c)+teamTable(G,b,a,c);
 const active=document.activeElement&&document.activeElement.id;
 document.getElementById('game').innerHTML=html;
 if(active&&document.getElementById(active))document.getElementById(active).focus();
}

 const d=new Date();const off=d.getTimezoneOffset();
 const local=new Date(d.getTime()-off*60000).toISOString().slice(0,10);
 document.getElementById('date').value=local;
 loadGames();
})();
</script>
